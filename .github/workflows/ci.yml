name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Python syntax check
        run: |
          python -m py_compile app.py core.py tests/test_engine.py

      - name: Install deps
        run: pip install -r requirements.txt

      - name: JS offline tests
        run: node tests/test_extraction.js

      - name: Flask route tests (test_client, no server)
        run: |
          cp config.example.json config.json
          python - <<'EOF'
          import json, tempfile, os
          from pathlib import Path

          # 造一个最小知识库，替换 config 里的占位路径
          wiki = Path(tempfile.mkdtemp())
          (wiki / "entities").mkdir()
          (wiki / "entities" / "测试页面.md").write_text(
              "---\ntitle: 测试页面\ntype: entity\n---\n\n# 测试页面\n\n内容。\n",
              encoding="utf-8",
          )
          cfg = json.loads(Path("config.json").read_text(encoding="utf-8"))
          cfg["wiki_root"] = str(wiki)
          cfg["hermes_exe"] = "/nonexistent"   # 路由测试不 spawn
          cfg["state_db"] = "/nonexistent"
          Path("config.json").write_text(json.dumps(cfg), encoding="utf-8")

          from app import app
          c = app.test_client()
          assert c.get("/").status_code == 200
          assert c.get("/api/version").status_code == 200
          assert c.get("/api/site-config").status_code == 200
          assert "测试页面" in c.get("/api/wiki-index").get_json()
          assert c.get("/api/wiki-raw/entities/测试页面.md").status_code == 200
          assert c.get("/wiki/../../etc/passwd").status_code == 404
          assert c.post("/api/ask", json={"question": ""}).status_code == 400
          assert c.get("/api/stream/nonexistent").status_code == 404
          print("ALL ROUTE TESTS PASSED")
          EOF
